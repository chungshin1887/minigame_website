<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 제목 -->
    <header>
        <h1>MINI GAMES</h1>
        <p>친구들과 함께 만든 미니게임</p>
    </header>


    <!-- 게임 목록 -->
    <main class="game-container">

        <!-- 게임 1 -->
        <a href="https://chungshin1887.github.io/shadow_puzzleGame/" class="game-card">
            <div class="game-number">GAME 01</div>
            <h2>그림자 퍼즐</h2>
            <span>PLAY →</span>
        </a>


        <!-- 게임 2 -->
        <a href="https://rosebud.ai/play/cyber-escape" class="game-card">
            <div class="game-number">GAME 02</div>
            <h2>게임 2 이름</h2>
            <span>PLAY →</span>
        </a>


        <!-- 게임 3 -->
        <a href="게임3 링크를 여기에 입력" class="game-card">
            <div class="game-number">GAME 03</div>
            <h2>버그를 역이용한 탈출 게임</h2>
            <span>PLAY →</span>
        </a>

    </main>

</body>
</html>
